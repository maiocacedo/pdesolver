name: Feature Request
description: Suggest a new feature or solver capability
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Proposed Feature
      description: Describe the feature you would like.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Use Case / Motivation
      description: Why is this feature needed?
    validations:
      required: true
