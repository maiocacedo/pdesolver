[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdesolver"
version = "0.2.0"
description = "Symbolic PDE solver using finite difference discretization"
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
authors = [
    {name = "Caio Macedo", email = "caiomacedo@alunos.utfpr.edu.br"},
]
requires-python = ">=3.9"
keywords = ["pde", "differential equations", "numerical methods", "finite differences", "solver"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24",
    "sympy>=1.12",
    "matplotlib>=3.7",
    "scipy>=1.10",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x"]
dev = ["pytest>=7", "build", "twine", "ruff"]

[project.urls]
Homepage = "https://github.com/maiocacedo/PDESsolver"
Repository = "https://github.com/maiocacedo/PDESsolver"
"Bug Tracker" = "https://github.com/maiocacedo/PDESsolver/issues"
Changelog = "https://github.com/maiocacedo/PDESsolver/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["pdesolver*"]
exclude = ["Tests*", "backend*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["Tests"]
python_files = ["test_*.py"]
addopts = "-ra --import-mode=importlib"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["pdesolver"]
